<div class="d-flex justify-content-center align-items-center vh-100">
    <main class="form-signin w-25">
        <form #loginForm="ngForm" (ngSubmit)="login()" autocomplete="off">
            <h1 class="h3 mb-3 fw-normal text-center">Please Login</h1>

            <div class="form-floating">
                <input type="UserName" class="form-control" [(ngModel)]="model.UserName" id="floatingUserName"
                    name="UserName">
                <label for="floatingUserName">UserName</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" [(ngModel)]="model.Password" id="floatingPassword"
                    name="Password">
                <label for="floatingPassword">Password</label>
            </div>

            <div class="form-check text-start my-3">
                <!-- <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                    Remember me
                </label> -->
            </div>

            <button class="btn btn-primary w-100 py-2" type="submit">Login</button>
        </form>
    </main>
</div>
